name: Build the package for compiling latex files.

on:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build the docker image for compiling latex files
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4
      - name: "Docker ビルド & プッシュ"
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=<registry>/<repo>,push-by-digest=true,name-canonical=true,push=true

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '<registry>/<repo>@sha256:%s ' *)
